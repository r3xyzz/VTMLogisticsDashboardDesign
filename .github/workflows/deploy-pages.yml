# Compila la app con Vite y la publica en GitHub Pages en cada push a main.
# GitHub Pages no puede ejecutar el código fuente (.tsx): hay que publicar el build (dist/).
# Requiere: Settings > Pages > Source = "GitHub Actions"
#           Settings > Secrets and variables > Actions: VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs: los .png (logo) se guardan con Git LFS (.gitattributes); sin esto se publica
      # el archivo "puntero" de texto en vez de la imagen y el logo no carga
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Los lockfiles están en .gitignore, por eso npm install (no npm ci)
      - run: npm install --no-audit --no-fund

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
